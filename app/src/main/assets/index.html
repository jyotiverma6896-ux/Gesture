<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hand Gesture Control</title>
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--fg:#f2f2f2;--mut:#9aa0ab;--acc:#3ddc97}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;padding:12px}
  h1{font-size:18px;margin:0 0 8px}
  #cam{position:relative;width:100%;max-width:480px;aspect-ratio:3/4;background:#000;border-radius:14px;overflow:hidden;margin:0 auto}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  #status{position:absolute;left:8px;right:8px;top:8px;padding:6px 10px;border-radius:8px;background:#000a;color:var(--acc);font-weight:600;z-index:2}
  button{width:100%;max-width:480px;display:block;margin:12px auto;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#04210f;font-size:16px;font-weight:700}
  .row{max-width:480px;margin:0 auto}
  #pager{display:flex;overflow:hidden;border-radius:14px;height:110px;background:var(--card)}
  #track{display:flex;width:100%;transition:transform .3s}
  .slide{min-width:100%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
  #vol{height:10px;background:var(--card);border-radius:5px;margin-top:10px;overflow:hidden}
  #volbar{height:100%;width:50%;background:var(--acc);transition:width .2s}
  p.h{color:var(--mut);margin:10px 0 0;font-size:13px;line-height:1.5}
  .sm{display:inline-block;width:auto;margin:6px 4px;padding:10px 14px;font-size:14px}
  #tp{display:none;max-width:480px;margin:8px auto;padding:10px;background:var(--card);border-radius:12px;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="row"><h1>Hand Gesture Control</h1></div>
<div id="cam"><div id="status">Start dabao</div><video id="v" playsinline muted></video><canvas id="c"></canvas></div>
<a id="openlink" target="_blank" style="display:none;max-width:480px;margin:12px auto;padding:14px;border-radius:12px;background:#ffd166;color:#241a00;font-weight:700;text-align:center;text-decoration:none"></a>
<button id="go">Camera chalu karo</button>
<div class="row" style="text-align:center"><button id="acc" class="sm" style="display:none"></button><button id="train" class="sm" style="background:#ffd166">Train karo</button></div>
<div id="tp"><div id="tt"></div><button id="rb" class="sm">Record (3 sec)</button><button id="rs" class="sm" style="background:#555;color:#fff">Reset</button></div>

<div class="row">
  <div id="pager"><div id="track"></div></div>
  <div id="vol"><div id="volbar"></div></div>
  <p class="h">Khula haath: upar/neeche/left/right = swipe.<br>
Hold 1 sec: ✊ mutthi = tap, ☝️ ek ungli = Back, ✌️ do ungli = Home, 3 ungli = Recents, 🤙 chhoti ungli = Notifications, 🤟 index+chhoti = double tap.<br>
Halka hilane pe bhi swipe ho to <b>Train karo</b> dabao.</p>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ===== SETTINGS =====
const SWIPE_WINDOW = 500, SWIPE_X = 0.20, SWIPE_Y = 0.10, SWIPE_COOLDOWN = 800, HOLD_MS = 900;
const APPS = {              // gesture -> [naam, link]
  FIST: ["Tap", "tap"],
  ONE_FINGER: ["Back", "back"],
  TWO_FINGERS: ["Home", "home"],
  THREE_FINGERS: ["Recents", "recents"],
  PINKY: ["Notifications", "notif"],
  ROCK: ["Double tap", "dtap"],
};
// =====================

const $ = id => document.getElementById(id);
const v = $("v"), c = $("c"), ctx = c.getContext("2d"), st = $("status");
const slides = ["Slide 1","Slide 2","Slide 3","Slide 4","Slide 5"];
const cols = ["#2b6cb0","#2f855a","#b7791f","#9b2c2c","#6b46c1"];
$("track").innerHTML = slides.map((s,i)=>`<div class="slide" style="background:${cols[i]}">${s}</div>`).join("");
let idx = 0, vol = 50;
function render(){ $("track").style.transform = `translateX(${-idx*100}%)`; $("volbar").style.width = vol+"%"; }
render();

const dist = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
function classify(lm){
  const up = [[8,6],[12,10],[16,14],[20,18]].map(([t,p])=>dist(lm[t],lm[0]) > dist(lm[p],lm[0])*1.05);
  const [i,m,r,p] = up;
  if (up.every(Boolean)) return "OPEN_PALM";
  if (i && !m && !r && !p) return "ONE_FINGER";
  if (i && m && !r && !p) return "TWO_FINGERS";
  if (i && m && r && !p) return "THREE_FINGERS";
  if (!i && !m && !r && p) return "PINKY";
  if (i && !m && !r && p) return "ROCK";
  if (!i && !m && !r && !p) return "FIST";
  return "NONE";
}

// App kholo, par ye page zinda rakho (naye tab mein). Popup block ho to tap-link dikhao.
function openApp(url, name){
  const w = window.open(url, "_blank");
  if (!w){
    const a = $("openlink");
    a.href = url; a.textContent = name + " kholo (tap)"; a.style.display = "block";
  }
}

// Screen on rakho + wapas aate hi camera/lock resume
let wl = null;
async function keepAwake(){ try{ if ("wakeLock" in navigator) wl = await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible"){
    await keepAwake();
    try{
      const t = v.srcObject && v.srcObject.getVideoTracks()[0];
      if (!t || t.readyState === "ended"){
        v.srcObject = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user" }, audio:false });
      }
      await v.play();
      $("openlink").style.display = "none";
    }catch(e){ st.textContent = "Camera resume fail: " + e.message; }
  }
});

let hist = [], lastSwipe = 0, cur = null, curStart = 0, fired = false;
// Termux server ko command bhejo -> wo adb se asli swipe/tap karta hai
function send(d){
  if (window.Android){
    if (!Android.cmd(d)){ st.textContent = "Accessibility service ON nahi hai"; }
    return;
  }
  fetch("/cmd?d=" + d).then(r => { if(!r.ok) throw 0; }).catch(() => { st.textContent = "Termux server/adb nahi mila"; });
}
function onSwipe(d){
  send(d);
  st.textContent = "Swipe " + d.toUpperCase();
  if (d==="right") idx = Math.min(idx+1, slides.length-1);
  if (d==="left")  idx = Math.max(idx-1, 0);
  if (d==="up")    vol = Math.min(vol+20, 100);
  if (d==="down")  vol = Math.max(vol-20, 0);
  render();
}
let TH = { x: SWIPE_X, y: SWIPE_Y };
try { const k = JSON.parse(localStorage.getItem("hg_cal") || "null"); if (k && k.x && k.y) TH = k; } catch(e){}
const OPP = { up:"down", down:"up", left:"right", right:"left" };
let lastDir = null, rec = null;
function peak(a, ax){
  let m = 0;
  for (let i=0;i<a.length;i++) for (let j=i+1;j<a.length;j++){
    if (a[j].t - a[i].t > SWIPE_WINDOW) break;
    m = Math.max(m, Math.abs(a[j][ax] - a[i][ax]));
  }
  return m;
}
function step(lm, now){
  const g = classify(lm), palm = lm[9];
  if (rec){ if (g==="OPEN_PALM") rec.push({t:now, x:1-palm.x, y:palm.y}); return; }
  if (g==="OPEN_PALM"){
    hist.push({t:now, x:1-palm.x, y:palm.y});
    hist = hist.filter(h => now-h.t <= SWIPE_WINDOW);
    if (hist.length>=3 && now-lastSwipe>SWIPE_COOLDOWN){
      const dx = hist.at(-1).x-hist[0].x, dy = hist.at(-1).y-hist[0].y;
      let d = null;
      if (Math.abs(dy) > TH.y && Math.abs(dy) > Math.abs(dx)*1.1) d = dy>0 ? "down":"up";
      else if (Math.abs(dx) > TH.x && Math.abs(dx) > Math.abs(dy)*1.5) d = dx>0 ? "right":"left";
      if (d){
        if (!(lastDir === OPP[d] && now-lastSwipe < 1200)){ onSwipe(d); lastSwipe = now; lastDir = d; }
        hist = [];
      }
    }
  } else hist = [];

  if (APPS[g]){
    if (g!==cur){ cur=g; curStart=now; fired=false; }
    const held = now-curStart;
    if (!fired){
      st.textContent = `${APPS[g][0]}... ${(held/1000).toFixed(1)}s`;
      if (held>=HOLD_MS){ fired=true; send(APPS[g][1]); st.textContent = APPS[g][0]+" bhej diya"; }
    }
  } else { cur=null; fired=false; }
}

// ===== TRAINING =====
const steps = [
  ["y","UPAR-NEECHE bahut HALKA hilao (jitna galti se ho jata hai)"],
  ["y","UPAR-NEECHE NORMAL swipe karo (jaisa chahiye)"],
  ["x","LEFT-RIGHT bahut HALKA hilao"],
  ["x","LEFT-RIGHT NORMAL swipe karo"]];
let ti = -1, res = [];
function showStep(pre){ $("tt").textContent = (pre||"") + `Step ${ti+1}/4: ${steps[ti][1]}. Khula haath dikhao, 'Record' dabao, 3 sec me 2-3 baar karo.`; }
function calc(a, b){ return b > a*1.25 ? a + 0.4*(b-a) : null; }
function finishTrain(){
  const y = calc(res[0],res[1]), x = calc(res[2],res[3]);
  ti = -1; st.textContent = "Haath dikhao";
  if (y===null || x===null){ $("tt").textContent = "Halka aur normal me farak kam tha. Dobara 'Train karo' dabao: halka bahut chhota, normal saaf bada."; return; }
  TH = { y: Math.max(y,0.04), x: Math.max(x,0.04) };
  try{ localStorage.setItem("hg_cal", JSON.stringify(TH)); }catch(e){}
  $("tt").textContent = `Save ho gaya ✅ upar-neeche ${TH.y.toFixed(2)}, left-right ${TH.x.toFixed(2)}. Ab halka hilane pe swipe nahi hoga.`;
}
$("train").onclick = () => { ti = 0; res = []; $("tp").style.display = "block"; showStep(); };
$("rs").onclick = () => { TH = {x:SWIPE_X, y:SWIPE_Y}; try{ localStorage.removeItem("hg_cal"); }catch(e){} ti = -1; $("tt").textContent = "Default settings wapas aa gayi."; };
$("rb").onclick = () => {
  if (ti < 0 || rec) return;
  rec = []; st.textContent = "Recording... haath hilao";
  setTimeout(() => {
    const m = peak(rec, steps[ti][0]); rec = null; st.textContent = "Haath dikhao";
    if (m < 0.01){ showStep("Khula haath nahi dikha, dobara. "); return; }
    res.push(m); ti++;
    if (ti < 4) showStep(`Naap: ${m.toFixed(2)}. `); else finishTrain();
  }, 3000);
};

// ===== ACCESSIBILITY ON/OFF BUTTON =====
if (window.Android){
  const ab = $("acc"); ab.style.display = "inline-block";
  const upd = () => { ab.textContent = Android.ready() ? "Accessibility OFF karo (UPI ke liye)" : "Accessibility ON karo"; };
  ab.onclick = () => { if (Android.ready()) Android.stopService(); else Android.openAccessibility(); setTimeout(upd, 500); };
  upd(); setInterval(upd, 1500);
}

$("go").onclick = async () => {
  if (window.Android && !Android.ready()){ Android.openAccessibility(); }
  $("go").disabled = true; $("go").textContent = "Load ho raha hai...";
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new Error("Camera is page par allowed nahi hai. Page https:// link se kholna padega (file se nahi).");
    }
    await keepAwake();
    st.textContent = "Camera maang raha hoon...";
    v.srcObject = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user" }, audio:false });
    await v.play();
    st.textContent = "Model load ho raha hai...";
    const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const mk = d => HandLandmarker.createFromOptions(fs, {
      baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate:d },
      runningMode:"VIDEO", numHands:1
    });
    let hl;
    try { hl = await mk("GPU"); } catch (e) { hl = await mk("CPU"); }
    c.width = v.videoWidth; c.height = v.videoHeight;
    $("go").style.display = "none"; st.textContent = "Haath dikhao";
    let lastT = -1;
    (function loop(){
      if (v.currentTime !== lastT){
        lastT = v.currentTime;
        const now = performance.now();
        const res = hl.detectForVideo(v, now);
        ctx.clearRect(0,0,c.width,c.height);
        if (res.landmarks.length){
          const lm = res.landmarks[0];
          ctx.fillStyle = "#3ddc97";
          lm.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x*c.width, p.y*c.height, 4, 0, 7); ctx.fill(); });
          step(lm, now);
        } else { hist=[]; cur=null; fired=false; }
      }
      requestAnimationFrame(loop);
    })();
  } catch(e){
    st.textContent = "Error: " + (e && e.name ? e.name + " - " : "") + (e && e.message ? e.message : e);
    st.style.color = "#ff8a8a";
    $("go").disabled = false; $("go").textContent = "Dobara try karo";
  }
};
</script>
</body>
</html>
